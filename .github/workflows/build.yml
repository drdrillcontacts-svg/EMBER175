name: Build VST3

on:
  push:
    branches: [ "**" ]
    tags: [ "v*" ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JUCE_VERSION: "8.0.6"

jobs:
  # ---------------------------------------------------------------------------
  # DSP tests: fast, no plug-in build required
  # ---------------------------------------------------------------------------
  dsp-tests:
    name: DSP tests (ubuntu)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build-tests -DCMAKE_BUILD_TYPE=Release -DEMBER_BUILD_PLUGIN=OFF
      - name: Build tests
        run: cmake --build build-tests --target ember_dsp_tests -j 4
      - name: Run tests
        run: ./build-tests/ember_dsp_tests -v

  # ---------------------------------------------------------------------------
  # Windows VST3
  # ---------------------------------------------------------------------------
  windows:
    name: Windows x64 VST3
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: >
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64
          -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Run DSP tests
        shell: pwsh
        run: |
          $test = Get-ChildItem -Path build -Filter "ember_dsp_tests.exe" -Recurse -File | Select-Object -First 1
          if (-not $test) { throw "DSP test executable not found" }
          & $test.FullName -v
          if ($LASTEXITCODE -ne 0) { throw "DSP tests failed" }

      - name: Package
        shell: pwsh
        run: |
          $vst3 = Get-ChildItem -Path build -Filter "*.vst3" -Recurse -Directory |
                  Where-Object { $_.FullName -match "Release" } | Select-Object -First 1
          if (-not $vst3) { $vst3 = Get-ChildItem -Path build -Filter "*.vst3" -Recurse -Directory | Select-Object -First 1 }
          if (-not $vst3) { throw "VST3 bundle not found" }
          Write-Host "Packaging $($vst3.FullName)"
          New-Item -ItemType Directory -Force -Path stage | Out-Null
          Copy-Item -Recurse $vst3.FullName stage/
          Get-ChildItem stage -Recurse | Select-Object FullName
          Compress-Archive -Path "stage/$($vst3.Name)" -DestinationPath "EMBER175-B-Windows-x64-VST3.zip" -Force

      - uses: actions/upload-artifact@v4
        with:
          name: EMBER175-B-Windows-x64-VST3
          path: EMBER175-B-Windows-x64-VST3.zip
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # macOS universal VST3 + AU
  # ---------------------------------------------------------------------------
  macos:
    name: macOS universal VST3 + AU
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: >
          cmake -S . -B build -G Xcode
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          -DCMAKE_OSX_DEPLOYMENT_TARGET=10.13

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Run DSP tests
        run: |
          TEST=$(find build -name "ember_dsp_tests" -type f -perm -u+x | head -n 1)
          echo "running $TEST"
          "$TEST" -v

      - name: Ad-hoc sign
        run: |
          for f in $(find build -name "*.vst3" -o -name "*.component" -o -name "*.app"); do
            codesign --force --deep --sign - "$f" || true
          done

      - name: Package
        run: |
          mkdir -p stage
          find build -name "*.vst3" -type d -exec cp -R {} stage/ \;
          find build -name "*.component" -type d -exec cp -R {} stage/ \;
          ls -R stage
          ditto -c -k --sequesterRsrc --keepParent stage EMBER175-B-macOS-universal.zip

      - uses: actions/upload-artifact@v4
        with:
          name: EMBER175-B-macOS-universal
          path: EMBER175-B-macOS-universal.zip
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Linux VST3 + front panel render
  # ---------------------------------------------------------------------------
  linux:
    name: Linux x64 VST3
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config \
            libasound2-dev libfreetype6-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev \
            libxinerama-dev libxrandr-dev libxrender-dev libgl1-mesa-dev
          # only needed if JUCE_WEB_BROWSER is ever turned on
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev || true

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DEMBER_BUILD_UI_PREVIEW=ON

      - name: Build
        run: cmake --build build --parallel 4

      - name: Run DSP tests
        run: ./build/ember_dsp_tests -v

      - name: Render front panel
        run: |
          PREVIEW=$(find build -name "ember_ui_preview" -type f -perm -u+x | head -n 1)
          echo "renderer: $PREVIEW"
          "$PREVIEW" ember175-panel.png 1800 540

      - name: Package
        run: |
          mkdir -p stage
          find build -name "*.vst3" -type d -exec cp -R {} stage/ \;
          find build -name "EMBER 175-B" -type f -perm -u+x -exec cp {} stage/ \;
          ls -R stage
          cd stage && zip -r ../EMBER175-B-Linux-x64.zip .

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: EMBER175-B-Linux-x64-VST3
          path: EMBER175-B-Linux-x64.zip
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: EMBER175-B-front-panel
          path: ember175-panel.png
          if-no-files-found: warn
