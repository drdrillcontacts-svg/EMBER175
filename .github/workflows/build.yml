name: Build and test VST3

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Configure CMake
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64
      - name: Build plugin and DSP tests
        run: cmake --build build --config Release --parallel
      - name: Run DSP tests
        shell: pwsh
        run: |
          $test = Get-ChildItem -Path build -Filter "ember_dsp_tests.exe" -Recurse -File | Select-Object -First 1
          if (-not $test) { throw "DSP test executable was not found." }
          & $test.FullName
          if ($LASTEXITCODE -ne 0) { throw "DSP tests failed." }
      - name: Package VST3
        shell: pwsh
        run: |
          $plugin = Get-ChildItem -Path build -Filter "*.vst3" -Recurse -Directory | Where-Object { $_.FullName -match "EMBER175" -or $_.Name -eq "EMBER 175 Reference Lab.vst3" } | Select-Object -First 1
          if (-not $plugin) { $plugin = Get-ChildItem -Path build -Filter "*.vst3" -Recurse -Directory | Select-Object -First 1 }
          if (-not $plugin) { throw "VST3 bundle was not found." }
          Compress-Archive -Path $plugin.FullName -DestinationPath "$env:GITHUB_WORKSPACE/EMBER175-ReferenceLab-Windows-x64.zip" -Force
      - uses: actions/upload-artifact@v4
        with:
          name: EMBER175-ReferenceLab-Windows-x64
          path: EMBER175-ReferenceLab-Windows-x64.zip
          if-no-files-found: error
